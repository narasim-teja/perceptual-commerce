[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
gas_reports = ["Policy"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"
