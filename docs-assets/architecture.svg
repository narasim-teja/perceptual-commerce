<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660" role="img" aria-labelledby="title desc">
  <title id="title">Tessr architecture: perception proposes, policy authorizes, settlement executes</title>
  <desc id="desc">Three planes, left to right. Perception runs in the browser, holds no keys, and emits an Observation carrying a signal, a confidence, evidence and a basis. That payload crosses a hard trust boundary into Policy, a contract on Monad, which is the mint authority and returns an Authorization. On allow, Settlement mints one scoped card for that intent, with the amount ceiling, merchant category and expiry enforced by the issuer. On deny, nothing is minted and the refusal is written on chain.</desc>

  <defs>
    <!-- A refusal is hatched, not merely red, so it survives a washed-out
         projector, a greyscale print and a colourblind reader. Same rule the
         interface uses: the stripes are the signal, the colour is a bonus. -->
    <pattern id="hatch" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#ff5a3c"/>
      <rect width="6" height="12" fill="#0a0a0a" opacity="0.22"/>
    </pattern>
    <style>
      .b  { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; letter-spacing: 1.4px; }
      .m  { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
      .s  { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .ink { fill: #0a0a0a; }  .ink2 { fill: #2e2c29; }  .ink3 { fill: #6b6659; }
      .inv { fill: #f5f3ec; }  .inv2 { fill: #a8a296; }
      .rule { stroke: #0a0a0a; stroke-width: 2; }
      .hair { fill: #ded9cb; }
    </style>
  </defs>

  <rect width="1240" height="660" fill="#f5f3ec"/>

  <!-- ═══ nameplate ═══════════════════════════════════════════════════════ -->
  <text class="b ink" x="40" y="42" font-size="17">TESSR</text>
  <text class="m ink3" x="132" y="42" font-size="12.5">the perception layer for agentic commerce</text>
  <rect x="40" y="56" width="1160" height="4" class="ink"/>
  <rect x="40" y="64" width="1160" height="1" class="ink"/>

  <!-- ═══ the trust boundary, drawn first so the payload sits on top ═══════ -->
  <text class="b ink" x="410" y="92" font-size="10" text-anchor="middle">TRUST BOUNDARY</text>
  <line x1="410" y1="102" x2="410" y2="452" stroke="#0a0a0a" stroke-width="2" stroke-dasharray="5 6"/>
  <text class="m ink3" x="410" y="470" font-size="10" text-anchor="middle">no key crosses this</text>

  <!-- ═══ PLANE 1 · PERCEPTION ════════════════════════════════════════════ -->
  <rect x="40" y="108" width="286" height="322" fill="#f5f3ec" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="40" y="108" width="286" height="38" fill="#ece9df"/>
  <rect x="40" y="146" width="286" height="2" class="ink"/>
  <text class="b ink" x="56" y="133" font-size="13">PERCEPTION</text>
  <text class="m ink3" x="310" y="133" font-size="10.5" text-anchor="end">the browser</text>

  <text class="s ink2" x="56" y="177" font-size="13">A camera, a price feed, a</text>
  <text class="s ink2" x="56" y="197" font-size="13">calendar. Anything that can</text>
  <text class="s ink2" x="56" y="217" font-size="13">read the world.</text>
  <rect x="56" y="234" width="254" height="1" class="hair"/>

  <text class="b ink3" x="56" y="257" font-size="9.5">SWAPPABLE AT RUNTIME</text>
  <text class="m ink2" x="56" y="279" font-size="11">screen · region diff, no model</text>
  <text class="m ink2" x="56" y="298" font-size="11">Xenova/yolos-tiny · 9 mb</text>
  <text class="m ink2" x="56" y="317" font-size="11">rfdetr_nano-ONNX · 29 mb</text>
  <text class="m ink2" x="56" y="336" font-size="11">owlvit-base-patch32 · 148 mb</text>

  <rect x="56" y="356" width="254" height="52" class="ink"/>
  <text class="b inv" x="70" y="377" font-size="10.5">CANNOT SPEND</text>
  <text class="m inv2" x="70" y="396" font-size="10">no key, no amount, no payee</text>

  <!-- ─── edge: the observation, and it is the only thing that crosses ──── -->
  <line x1="326" y1="250" x2="486" y2="250" class="rule"/>
  <polygon points="486,244 496,250 486,256" class="ink"/>
  <rect x="344" y="222" width="132" height="56" class="ink"/>
  <text class="b inv" x="410" y="241" font-size="9.5" text-anchor="middle">OBSERVATION</text>
  <text class="m inv2" x="410" y="258" font-size="9.5" text-anchor="middle">signal · confidence</text>
  <text class="m inv2" x="410" y="271" font-size="9.5" text-anchor="middle">evidence · basis</text>

  <!-- ═══ PLANE 2 · POLICY ════════════════════════════════════════════════ -->
  <rect x="494" y="108" width="286" height="322" fill="#f5f3ec" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="494" y="108" width="286" height="38" class="ink"/>
  <text class="b inv" x="510" y="133" font-size="13">POLICY</text>
  <text class="m inv2" x="764" y="133" font-size="10.5" text-anchor="end">Policy.sol · Monad</text>

  <text class="s ink2" x="510" y="177" font-size="13">The mint authority. It rules</text>
  <text class="s ink2" x="510" y="197" font-size="13">on whether the instrument</text>
  <text class="s ink2" x="510" y="217" font-size="13">may exist at all.</text>
  <rect x="510" y="234" width="254" height="1" class="hair"/>

  <text class="b ink3" x="510" y="257" font-size="9.5">WHAT IT CHECKS</text>
  <text class="m ink2" x="510" y="279" font-size="11">payee allowlist · mcc allowlist</text>
  <text class="m ink2" x="510" y="298" font-size="11">amount cap · velocity window</text>
  <text class="m ink2" x="510" y="317" font-size="11">kill switch</text>
  <text class="m ink3" x="510" y="336" font-size="11">every ruling written on chain</text>

  <rect x="510" y="356" width="254" height="52" class="ink"/>
  <text class="b inv" x="524" y="377" font-size="10.5">FAIL CLOSED</text>
  <text class="m inv2" x="524" y="396" font-size="10">timeout, dead rpc, replay: deny</text>

  <!-- ─── edge: the authorization ───────────────────────────────────────── -->
  <line x1="780" y1="250" x2="930" y2="250" class="rule"/>
  <polygon points="930,244 940,250 930,256" class="ink"/>
  <rect x="794" y="222" width="132" height="56" class="ink"/>
  <text class="b inv" x="860" y="241" font-size="9.5" text-anchor="middle">AUTHORIZATION</text>
  <text class="m inv2" x="860" y="258" font-size="9.5" text-anchor="middle">allow · onchainRef</text>
  <text class="m inv2" x="860" y="271" font-size="9.5" text-anchor="middle">expiresAt</text>

  <!-- ═══ PLANE 3 · SETTLEMENT ════════════════════════════════════════════ -->
  <rect x="940" y="108" width="260" height="322" fill="#f5f3ec" stroke="#0a0a0a" stroke-width="2"/>
  <rect x="940" y="108" width="260" height="38" fill="#ece9df"/>
  <rect x="940" y="146" width="260" height="2" class="ink"/>
  <text class="b ink" x="956" y="133" font-size="13">SETTLEMENT</text>
  <text class="m ink3" x="1184" y="133" font-size="10.5" text-anchor="end">one card per intent</text>

  <text class="s ink2" x="956" y="177" font-size="13">A scoped card, minted</text>
  <text class="s ink2" x="956" y="197" font-size="13">per authorized intent.</text>
  <rect x="956" y="214" width="228" height="1" class="hair"/>

  <text class="b ink3" x="956" y="237" font-size="9.5">THE ISSUER ENFORCES</text>
  <text class="m ink2" x="956" y="259" font-size="11">amount ceiling</text>
  <text class="m ink2" x="956" y="278" font-size="11">merchant category</text>
  <text class="m ink2" x="956" y="297" font-size="11">expiry</text>
  <text class="m ink2" x="956" y="316" font-size="11">one approved use</text>

  <rect x="956" y="356" width="228" height="52" class="ink"/>
  <text class="b inv" x="970" y="377" font-size="10.5">CANNOT ACT ALONE</text>
  <text class="m inv2" x="970" y="396" font-size="10">settle() needs the Authorization</text>

  <!-- ═══ the deny path: down, and it stops ═══════════════════════════════ -->
  <line x1="637" y1="430" x2="637" y2="466" stroke="#0a0a0a" stroke-width="2" stroke-dasharray="5 5"/>
  <polygon points="631,466 643,466 637,476" class="ink"/>
  <rect x="494" y="480" width="286" height="52" fill="url(#hatch)" stroke="#0a0a0a" stroke-width="2"/>
  <text class="b ink" x="637" y="503" font-size="12" text-anchor="middle">DENY</text>
  <text class="m ink" x="637" y="521" font-size="10" text-anchor="middle">no card is ever created</text>
  <text class="m ink3" x="798" y="503" font-size="10.5">the refusal is written on chain too, as a</text>
  <text class="m ink3" x="798" y="519" font-size="10.5">MintRuling event anyone can open</text>

  <!-- ═══ the rule the whole thing exists to state ════════════════════════ -->
  <rect x="40" y="566" width="1160" height="2" class="ink"/>
  <text class="s ink" x="40" y="596" font-size="14">Perception proposes. Only the contract can authorize. Settlement cannot be called without an Authorization, by signature.</text>
  <text class="s ink2" x="40" y="620" font-size="12.5">The contract is the mint authority: it decides whether the card may exist. The issuer is the spend authority: it decides what the card may do.</text>
  <text class="s ink2" x="40" y="640" font-size="12.5">Two independent authorities. Tessr does not intercept a live card authorization and does not claim to.</text>
</svg>
